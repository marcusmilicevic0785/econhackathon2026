[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econhackathon2026"
version = "0.1.0"
description = "Verified, reproducible third-space research for EconHack 2026"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<0.15", "matplotlib>=3.9,<4", "requests>=2.32,<3", "shapely>=2,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<7"]

[project.scripts]
econhack = "econhack.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
