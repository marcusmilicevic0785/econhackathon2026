name: Verify and reproduce published research

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test transformation and statistical contracts
        run: python -m pytest -q
      - name: Verify source and extract checksums
        run: econhack verify
      - name: Reproduce published models without network
        run: econhack run --offline
      - name: Execute companion notebooks
        run: python scripts/build_notebooks.py --execute
